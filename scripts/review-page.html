<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>구축 기사 검토</title>
    <style>
      :root {
        --ink: #172b35;
        --muted: #6c7d83;
        --line: #dfe8ea;
        --teal: #087f72;
        --soft: #e6f5ef;
        --bg: #f5f8f8;
        --white: #fff;
        --warn: #b54708;
        --warn-soft: #fef0e6;
        --bad: #b42318;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e0eaed;
          --muted: #9bafb7;
          --line: #304149;
          --teal: #64d7be;
          --soft: #193e35;
          --bg: #10191e;
          --white: #19262d;
          --warn: #f5a35c;
          --warn-soft: #3a2616;
          --bad: #ff8a80;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 10px 16px;
        background: var(--white);
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }
      header h1 {
        font-size: 16px;
        margin: 0;
      }
      header .spacer {
        flex: 1;
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
        gap: 16px;
        padding: 16px;
        max-width: 1500px;
        margin: 0 auto;
      }
      @media (max-width: 900px) {
        main {
          grid-template-columns: 1fr;
        }
      }
      section {
        background: var(--white);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        min-width: 0;
      }
      h2 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      button,
      select,
      input,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        border: 1px solid var(--line);
        background: var(--white);
        border-radius: 8px;
        padding: 7px 12px;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--teal);
      }
      button.primary {
        background: var(--teal);
        color: var(--white);
        border-color: var(--teal);
        font-weight: 600;
      }
      button.danger {
        color: var(--bad);
      }
      input,
      select,
      textarea {
        border: 1px solid var(--line);
        background: var(--bg);
        border-radius: 8px;
        padding: 6px 8px;
        width: 100%;
      }
      label {
        display: grid;
        gap: 3px;
        font-size: 12px;
        color: var(--muted);
      }
      .images {
        display: grid;
        gap: 10px;
      }
      .image {
        border: 3px solid transparent;
        border-radius: 10px;
        padding: 0;
        background: none;
        text-align: left;
      }
      .image img {
        display: block;
        width: 100%;
        border-radius: 7px;
        background: var(--bg);
      }
      .image.selected {
        border-color: var(--teal);
      }
      .image small {
        display: block;
        padding: 3px 6px;
        color: var(--muted);
        word-break: break-all;
      }
      .meta {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 12px;
      }
      .meta .wide {
        grid-column: 1 / -1;
      }
      .team {
        display: grid;
        gap: 6px;
        margin-bottom: 10px;
      }
      .slot {
        display: grid;
        grid-template-columns: 22px minmax(0, 1fr) minmax(0, 1fr);
        gap: 6px;
        align-items: center;
      }
      .slot.focus [data-field="pokemon"] {
        outline: 2px solid var(--teal);
      }
      .slot .n {
        color: var(--muted);
        text-align: right;
      }
      .key {
        font-size: 11px;
        color: var(--muted);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 6px 0 12px;
      }
      .chip {
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 13px;
      }
      .chip.used {
        opacity: 0.45;
      }
      .chip.other {
        border-style: dashed;
      }
      .flags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 6px 0;
      }
      .flag {
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--soft);
        color: var(--teal);
      }
      .flag.warn {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-top: 12px;
      }
      .actions select {
        width: auto;
      }
      .message {
        min-height: 1.5em;
        margin-top: 8px;
        font-weight: 600;
      }
      .message.error {
        color: var(--bad);
      }
      .message.ok {
        color: var(--teal);
      }
      .muted {
        color: var(--muted);
      }
      a {
        color: var(--teal);
      }
      details {
        margin-top: 8px;
      }
      .empty {
        padding: 60px 16px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>구축 기사 검토 <span id="season" class="muted"></span></h1>
      <span id="progress" class="muted"></span>
      <span class="spacer"></span>
      <button id="prev" title="이전 (Alt+←)">◀ 이전</button>
      <button id="next" title="다음 (Alt+→)">다음 ▶</button>
    </header>
    <div id="app"></div>
    <datalist id="species-list"></datalist>
    <datalist id="item-list"></datalist>
    <script>
      const $ = id => document.getElementById(id);
      const esc = value =>
        String(value ?? '').replace(
          /[&<>"']/g,
          c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        );
      const NONE = '도구 없음';
      let options,
        list = [],
        at = 0,
        focus = 0,
        form = null;
      const speciesLabel = new Map(),
        speciesKey = new Map(),
        itemLabel = new Map(),
        itemKey = new Map();

      const FLAG_TEXT = {
        'rank-from-hint': '순위: 목록 페이지에서 읽음',
        'rank-missing': '순위 없음',
        'season-missing': '시즌 표기 없음',
        'format-missing': '싱글/더블 표기 없음',
        'monthly-challenge': '월간 챌린지 순위 섞임',
        'few-candidates': '후보 6 미만',
        'items-incomplete': '본문 도구 부족',
        'no-image': '이미지 없음',
        'image-not-cached': '이미지 캐시 실패',
        'before-champions': '챔피언스 이전 글',
        'other-game': '다른 게임 표기',
        'no-champions-mention': '챔피언스 표기 없음',
      };
      const WARN = new Set([
        'monthly-challenge',
        'before-champions',
        'other-game',
        'no-image',
        'image-not-cached',
        'rank-missing',
        'few-candidates',
      ]);

      async function start() {
        options = await fetch('/api/options').then(r => r.json());
        $('season').textContent = options.season;
        $('species-list').innerHTML = options.species
          .map(o => `<option value="${esc(o.label)}">`)
          .join('');
        $('item-list').innerHTML = [
          `<option value="${NONE}">`,
          ...options.items.map(o => `<option value="${esc(o.label)}">`),
        ].join('');
        for (const o of options.species) {
          speciesLabel.set(o.key, o.label);
          speciesKey.set(o.label, o.key);
        }
        for (const o of options.items) {
          itemLabel.set(o.key, o.label);
          itemKey.set(o.label, o.key);
        }
        await reload();
      }

      async function reload(keepUrl) {
        const data = await fetch('/api/list').then(r => r.json());
        list = data.list;
        const index = keepUrl ? list.findIndex(row => row.form.url === keepUrl) : -1;
        at = Math.min(index >= 0 ? index : at, Math.max(0, list.length - 1));
        show();
      }

      function show(message = '', kind = '') {
        $('progress').textContent = list.length ? `${at + 1} / ${list.length}` : '';
        if (!list.length) {
          $('app').innerHTML =
            '<div class="empty"><h2>검토할 기사가 없습니다</h2><p class="muted">큐가 비었거나 모두 기록·제외했습니다. 수집기를 다시 돌리면 새 기사가 들어옵니다.</p></div>';
          return;
        }
        const row = list[at];
        form = structuredClone(row.form);
        focus = form.team.findIndex(m => !m.pokemon);
        if (focus < 0) focus = 0;
        render(row, message, kind);
      }

      function imageSource(row, index) {
        const file = row.entry?.imageFiles?.[index];
        return file
          ? `/cache/${file.split('/').pop()}`
          : (row.entry?.images?.[index] ?? form.teamImage);
      }

      function render(row, message, kind) {
        const entry = row.entry;
        const images = entry?.images?.length
          ? entry.images
          : form.teamImage
            ? [form.teamImage]
            : [];
        const used = new Set(form.team.map(m => m.pokemon));
        const baseOf = key => key.replace(/mega[xyz]?$/, '');
        const chips = (entry?.candidates ?? [])
          .map(c => {
            const key = c.forms[0] && /mega/.test(c.forms[0]) ? c.forms[0] : c.base;
            const label = speciesLabel.get(key) ?? speciesLabel.get(c.base) ?? c.base;
            const isUsed = [...used].some(
              k => k && (k === key || k === c.base || baseOf(k) === c.base),
            );
            const items = c.items
              .map(i => itemLabel.get(i) ?? i)
              .slice(0, 3)
              .join(', ');
            return `<button class="chip${isUsed ? ' used' : ''}${c.champions ? '' : ' other'}" data-pick="${esc(key)}" title="${esc(c.excerpt)}">${esc(label)} <span class="muted">×${c.hits}${items ? ' · ' + esc(items) : ''}</span></button>`;
          })
          .join('');
        const flags = (entry?.flags ?? [])
          .map(
            f => `<span class="flag${WARN.has(f) ? ' warn' : ''}">${esc(FLAG_TEXT[f] ?? f)}</span>`,
          )
          .join('');
        $('app').innerHTML = `<main>
    <section>
      <h2>팀 이미지 <span class="muted">— 팀이 보이는 이미지를 눌러 고릅니다</span></h2>
      <div class="images">${images.length ? images.map((url, i) => `<button class="image${url === form.teamImage ? ' selected' : ''}" data-image="${esc(url)}"><img src="${esc(imageSource(row, i))}" alt="" loading="lazy" referrerpolicy="no-referrer"><small>${esc(url)}</small></button>`).join('') : '<p class="muted">받아 둔 이미지가 없습니다. 원문을 열어 확인하고, 팀 이미지 주소를 아래에 붙여 넣으세요.</p>'}</div>
      <label style="margin-top:10px">팀 이미지 주소<input id="teamImage" value="${esc(form.teamImage)}"></label>
    </section>
    <section>
      <div class="flags"><span class="flag">${row.kind === 'pending' ? '이미 기록된 pending' : esc(entry?.source ?? '')}</span>${form.proposal ? `<span class="flag${form.proposal.verdict === 'party' ? '' : ' warn'}">AI 제안: ${esc({ party: '파티 확인', 'not-party': '파티 기사 아님', unsure: '불확실' }[form.proposal.verdict] ?? form.proposal.verdict)}</span>` : ''}${flags}</div>
      ${form.proposal?.note ? `<p class="muted" style="margin:0 0 8px">AI 메모: ${esc(form.proposal.note)}</p>` : ''}
      <p style="margin:4px 0 8px"><a href="${esc(form.url)}" target="_blank" rel="noopener noreferrer">${esc(form.title || form.url)} ↗</a>
        · <a href="/cached?url=${encodeURIComponent(form.url)}" target="_blank" title="원문이 열리지 않을 때 수집기가 받아 둔 사본을 연다">사본 보기</a></p>
      ${row.sameBlog?.length ? `<div class="flag warn" style="display:block;border-radius:8px;padding:6px 10px;margin:0 0 8px">같은 블로그에 이미 기록된 기사가 있습니다. 같은 글이면 [제외]에서 '이미 등록한 기사와 같은 글'을 고르세요.${row.sameBlog.map(a => `<br>· <a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${esc(a.season)} ${a.format === 'Doubles' ? '더블' : '싱글'} 최종 ${esc(a.rank)}위 — ${esc(a.title)}</a>${a.status === 'pending' ? ' (pending)' : ''}${a.top ? ` <b>— 블로그 첫 페이지 주소로 기록됨</b> <button data-move-from="${esc(a.url)}">이 기록을 지금 기사 주소로 옮기기</button>` : ''}`).join('')}</div>` : ''}
      ${entry?.leadText ? `<p class="muted" style="margin:0 0 8px">목록: ${esc(entry.leadText)}</p>` : ''}
      <div class="meta">
        <label>작성자<input id="author" value="${esc(form.author)}"></label>
        <label>최종 순위<input id="rank" type="number" min="1" value="${esc(form.rank)}"></label>
        <label>시즌<input id="seasonField" value="${esc(form.season || options.season)}"></label>
        <label>형식<select id="format"><option value="Singles"${form.format !== 'Doubles' ? ' selected' : ''}>싱글</option><option value="Doubles"${form.format === 'Doubles' ? ' selected' : ''}>더블</option></select></label>
        <label>게시일<input id="publishedAt" type="date" value="${esc(form.publishedAt)}"></label>
        <label class="wide">제목<input id="title" value="${esc(form.title)}"></label>
      </div>
      <h2>파티 <span class="muted">— 후보를 누르면 선택한 칸에 들어갑니다. 도구를 모르면 비워 두세요(추가되지 않음)</span></h2>
      <div class="team">${form.team
        .map(
          (m, i) => `<div class="slot${i === focus ? ' focus' : ''}" data-slot="${i}">
        <span class="n">${i + 1}</span>
        <div><input list="species-list" data-field="pokemon" data-i="${i}" value="${esc(speciesLabel.get(m.pokemon) ?? m.pokemon)}" placeholder="포켓몬"><div class="key">${esc(m.pokemon ? (options.japanese[m.pokemon] ?? '') + ' · ' + m.pokemon : '')}</div></div>
        <div><input list="item-list" data-field="item" data-i="${i}" value="${esc(m.item === null ? NONE : (itemLabel.get(m.item) ?? m.item))}" placeholder="도구 (모르면 비움)"><div class="key">${esc(m.item ?? '')}</div></div>
      </div>`,
        )
        .join('')}</div>
      <div class="chips">${chips}</div>
      <details><summary>근거 문장</summary>
        <label>팀 근거<textarea id="teamEvidence" rows="2">${esc(form.teamEvidence)}</textarea></label>
        <label>순위 근거<textarea id="rankEvidence" rows="2">${esc(form.rankEvidence)}</textarea></label>
      </details>
      ${entry?.excerpt ? `<details><summary>본문 첫 부분</summary><p class="muted" lang="ja">${esc(entry.excerpt)}</p></details>` : ''}
      <div class="actions">
        <button class="primary" id="add">추가 (공개)</button>
        <button id="add-pending">pending으로 추가</button>
        <select id="reason">
          <option>이미 등록한 기사와 같은 글</option><option>파티 기사가 아님</option><option>다른 시즌·형식</option><option>최종 파티를 공개하지 않음</option>
          <option>월간 챌린지 성적만 있음</option><option>원문과 이미지가 맞지 않음</option><option>기타</option>
        </select>
        <button class="danger" id="skip">제외</button>
        <button id="later">건너뛰기</button>
      </div>
      <div class="message ${kind}" id="message">${esc(message)}</div>
    </section>
  </main>`;
      }

      function readForm() {
        const value = id => $(id)?.value.trim() ?? '';
        form.author = value('author');
        form.rank = value('rank');
        form.season = value('seasonField')
          .toUpperCase()
          .replace(/[^M0-9]/g, '');
        form.format = value('format');
        form.publishedAt = value('publishedAt');
        form.title = value('title');
        form.teamImage = value('teamImage');
        form.teamEvidence = value('teamEvidence');
        form.rankEvidence = value('rankEvidence');
        document.querySelectorAll('[data-field]').forEach(input => {
          const member = form.team[input.dataset.i];
          const text = input.value.trim();
          if (input.dataset.field === 'pokemon') member.pokemon = speciesKey.get(text) ?? text;
          else member.item = text === NONE ? null : (itemKey.get(text) ?? text);
        });
        return form;
      }

      $('app').addEventListener('click', async event => {
        const image = event.target.closest('[data-image]');
        if (image) {
          readForm();
          form.teamImage = image.dataset.image;
          return rerender();
        }
        const pick = event.target.closest('[data-pick]');
        if (pick) {
          readForm();
          form.team[focus].pokemon = pick.dataset.pick;
          fillStone(focus);
          const next = form.team.findIndex(m => !m.pokemon);
          focus = next < 0 ? focus : next;
          return rerender();
        }
        const slot = event.target.closest('[data-slot]');
        if (slot && event.target.dataset.field === 'pokemon') {
          focus = Number(slot.dataset.slot);
          document.querySelectorAll('.slot').forEach(s => s.classList.toggle('focus', s === slot));
        }
        if (event.target.id === 'add' || event.target.id === 'add-pending') {
          const response = await fetch('/api/add', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              form: readForm(),
              status: event.target.id === 'add' ? 'reviewed' : 'pending',
            }),
          });
          const result = await response.json();
          if (!response.ok) return setMessage(result.error, 'error');
          await reload();
          return show(`추가했습니다: ${result.id}`, 'ok');
        }
        if (event.target.id === 'skip') {
          const reason = $('reason').value === '기타' ? prompt('제외 이유') : $('reason').value;
          if (!reason) return;
          const response = await fetch('/api/skip', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ url: form.url, reason }),
          });
          if (!response.ok) return setMessage((await response.json()).error, 'error');
          await reload();
          return show('제외했습니다.', 'ok');
        }
        const moveFrom = event.target.closest('[data-move-from]');
        if (moveFrom) {
          const response = await fetch('/api/move', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ from: moveFrom.dataset.moveFrom, to: form.url }),
          });
          const result = await response.json();
          if (!response.ok) return setMessage(result.error, 'error');
          await reload();
          return show(`기록 ${result.id}의 주소를 옮겼습니다. 같은 글이라 이 기사는 목록에서 빠졌습니다.`, 'ok');
        }
        if (event.target.id === 'later') move(1);
      });
      // 입력 칸을 바꾸면 그 칸만 고친다. 전체를 다시 그리면 바로 이어서 누른 단추가 사라진다.
      $('app').addEventListener('change', event => {
        if (!event.target.dataset.field) return;
        readForm();
        const i = Number(event.target.dataset.i);
        fillStone(i);
        updateSlot(i);
      });
      function updateSlot(i) {
        const member = form.team[i];
        const slot = document.querySelector(`[data-slot="${i}"]`);
        const [pokemonKey, itemKey] = slot.querySelectorAll('.key');
        pokemonKey.textContent = member.pokemon
          ? `${options.japanese[member.pokemon] ?? ''} · ${member.pokemon}`
          : '';
        itemKey.textContent = member.item ?? '';
        const itemInput = slot.querySelector('[data-field="item"]');
        if (document.activeElement !== itemInput)
          itemInput.value =
            member.item === null ? NONE : (itemLabel.get(member.item) ?? member.item ?? '');
      }
      // 메가를 고르고 도구가 비어 있으면 그 메가스톤을 넣는다.
      function fillStone(i) {
        const member = form.team[i];
        const stone = options.stones[member.pokemon];
        if (stone && !member.item) member.item = stone;
      }

      // 화면은 form에서 다시 그린다. 호출 전에 readForm으로 입력 값을 form에 옮겨 둔다.
      function rerender() {
        render(list[at], '', '');
      }
      function setMessage(text, kind) {
        const node = $('message');
        node.textContent = text;
        node.className = `message ${kind}`;
      }
      function move(step) {
        if (!list.length) return;
        at = (at + step + list.length) % list.length;
        show();
        window.scrollTo(0, 0);
      }
      $('prev').onclick = () => move(-1);
      $('next').onclick = () => move(1);
      document.addEventListener('keydown', event => {
        if (event.altKey && event.key === 'ArrowLeft') move(-1);
        if (event.altKey && event.key === 'ArrowRight') move(1);
      });
      start();
    </script>
  </body>
