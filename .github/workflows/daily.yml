# 매일 한 번 자료를 살핀다.
# 1. 상위 파티(포케DB 공개 데이터): 시즌이 끝나고 3·10·30일째에만 받는다. 받을 차례가 아니면
#    championsbattledata의 시즌 목록만 읽고 포케DB에는 요청하지 않는다.
# 2. 도감·계산기 자료(reference.json)가 새 레귤레이션을 따라가지 못했는지 살펴 디스코드로 알린다.
#    reference.json은 자동으로 바꾸지 않는다.
# 바뀐 자료는 main에 커밋하고, Cloudflare Pages가 그 커밋을 배포한다.
# 저장소 Settings → Secrets and variables → Actions에 DISCORD_WEBHOOK_URL을 넣어야 알림이 간다.
name: 매일 자료 점검

on:
  schedule:
    # 매일 05:00 KST. 포케DB 파일은 매일 01:00 JST 무렵 다시 만들어진다.
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 상위 파티 받기
        run: node scripts/update-top-teams.mjs --fetch
      - name: 레귤레이션 변경 점검
        run: node scripts/watch-upstream.mjs
      - name: 검사
        run: node --test tests/top-teams.test.mjs tests/watch-upstream.test.mjs
      - name: 바뀌었으면 main에 커밋
        run: |
          if git diff --quiet -- public/data/top-teams.json scripts/watch-state.json; then
            echo "바뀐 자료가 없다."
            exit 0
          fi
          updated=$(git diff --quiet -- public/data/top-teams.json || echo yes)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/top-teams.json scripts/watch-state.json
          git commit -m "매일 자료 점검: 상위 파티·알림 기록 갱신"
          git push
          if [ -n "$updated" ]; then
            node scripts/watch-upstream.mjs --message "상위 파티 자료를 갱신했습니다. 배포 후 앱의 ‘상위 파티’ 탭에 반영됩니다."
          fi
      - name: 실패 알림
        if: failure()
        run: node scripts/watch-upstream.mjs --message "매일 자료 점검이 실패했습니다. 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
